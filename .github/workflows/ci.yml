name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub repository boundary
        run: |
          test ! -e AGENTS.md
          test ! -d scripts
          test ! -d tools
          test ! -d docs
          test ! -d docs/repository
          test ! -d docs/superpowers
          test ! -d docs/ui-review
          test ! -d secrets
          test ! -d storage
          test ! -d backups
          test ! -e .env
          test ! -e current-release.json
          test -f .env.example
      - name: Run repository hygiene scan
        run: python deploy/check_repository_hygiene.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: research_os
          POSTGRES_USER: research_os
          POSTGRES_PASSWORD: research_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research_os -d research_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python manage.py test apps config
        working-directory: backend
        env:
          RESEARCH_OS_ENV: development
          DJANGO_SETTINGS_MODULE: config.ci_settings
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: research_os
          POSTGRES_USER: research_os
          POSTGRES_PASSWORD: research_os
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
